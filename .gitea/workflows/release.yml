name: Tendshelf release

# Runs only when a tag named v* is pushed (decision 0006: vYEAR.RELEASE.BUGFIX). It never runs on a push to
# a branch or a pull request. It builds the CGO-free server for linux amd64 and arm64, builds the desktop
# .deb for the runner's own architecture (arm64; the desktop needs CGO, GTK 4 and WebKitGTK 6, so it cannot
# be cross-built here), writes SHA256SUMS and attaches everything to a Gitea release for the tag.
#
# What the operator must provide: a repository secret named RELEASE_TOKEN, a Gitea access token of the
# account that may publish releases here, with the scope "write:repository". Without it the last step fails
# and nothing is published. To release: git tag vYEAR.RELEASE.BUGFIX && git push origin vYEAR.RELEASE.BUGFIX.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: build binaries and publish the release
    runs-on: [tend-ci, linux-arm64]
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      TAG: ${{ gitea.ref_name }}
    steps:
      - name: Check out the tag
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Go version declared by the module
        uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # setup-go v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install make, curl and the desktop build libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make gcc libc6-dev pkg-config curl ca-certificates dpkg-dev libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Server binaries (CGO_ENABLED=0, version embedded)
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch make build VERSION="$TAG" BIN="dist/tendshelf-${TAG}-linux-${arch}"
          done
      - name: Desktop .deb (arm64, the runner's architecture)
        # A failure here must not stop the server release, so the step is allowed to fail.
        continue-on-error: true
        run: |
          make deb VERSION="$TAG"
          cp bin/tendshelf-desktop_*.deb dist/
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release and attach the files
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
        run: |
          test -n "$RELEASE_TOKEN" || { echo "secret RELEASE_TOKEN is not set"; exit 1; }
          curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $RELEASE_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"See CHANGELOG.md for what is in this release and how to upgrade.\"}" \
            -o release.json
          id="$(grep -o '"id":[0-9]*' release.json | head -1 | cut -d: -f2)"
          test -n "$id" || { echo "no release id in the answer"; head -c 300 release.json; exit 1; }
          for f in dist/*; do
            curl -fsS -X POST "$API/releases/$id/assets?name=$(basename "$f")" \
              -H "Authorization: token $RELEASE_TOKEN" -F "attachment=@$f" -o /dev/null
            echo "attached $(basename "$f")"
          done

  # The Android APK (plan A10). A separate job after `release`, so nothing here can hold back or fail the server release
  # (it is also continue-on-error). Without the signing secrets it builds the UNSIGNED APK, says so, and attaches it under
  # a name that ends in -unsigned.apk; it never signs with a debug key. Google's Linux build tools are x86-64, so this
  # runs on the amd64 runner. With the workstation VPN up the runner's containers have no internet, and this job fails then.
  #
  # What the operator provides (names only, no values here):
  #   secrets   TS_ANDROID_KEYSTORE_B64 (the keystore file, base64), TS_ANDROID_KEYSTORE_PASSWORD, TS_ANDROID_KEY_ALIAS,
  #             TS_ANDROID_KEY_PASSWORD. Without all four the APK stays unsigned.
  #   variables TS_ANDROID_CMDLINE_TOOLS_URL and TS_ANDROID_CMDLINE_TOOLS_SHA256, the Android command-line tools
  #             archive and its SHA-256 (docs/android.md). Without them the job stops with a plain message.
  apk:
    name: build, verify and attach the Android APK
    needs: release
    runs-on: [tend-ci, linux-amd64]
    continue-on-error: true
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      TAG: ${{ gitea.ref_name }}
      TOOLS_URL: ${{ vars.TS_ANDROID_CMDLINE_TOOLS_URL }}
      TOOLS_SHA256: ${{ vars.TS_ANDROID_CMDLINE_TOOLS_SHA256 }}
    steps:
      - name: Check out the tag
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Java 21 and tools
        run: |
          uname -m
          apt-get update
          apt-get install -y --no-install-recommends openjdk-21-jdk-headless unzip curl ca-certificates binutils
      - name: Android SDK from the pinned command-line tools
        run: |
          if [ -z "$TOOLS_URL" ] || [ -z "$TOOLS_SHA256" ]; then
            echo "Android build skipped: the variables TS_ANDROID_CMDLINE_TOOLS_URL and TS_ANDROID_CMDLINE_TOOLS_SHA256 are not set (docs/android.md)."
            echo "SKIP_APK=1" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -fsSL "$TOOLS_URL" -o "$RUNNER_TEMP/cmdline-tools.zip"
          echo "$TOOLS_SHA256  $RUNNER_TEMP/cmdline-tools.zip" | sha256sum -c -
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Build, sign when the key is present, verify
        env:
          KEYSTORE_B64: ${{ secrets.TS_ANDROID_KEYSTORE_B64 }}
          TS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TS_ANDROID_KEYSTORE_PASSWORD }}
          TS_ANDROID_KEY_ALIAS: ${{ secrets.TS_ANDROID_KEY_ALIAS }}
          TS_ANDROID_KEY_PASSWORD: ${{ secrets.TS_ANDROID_KEY_PASSWORD }}
        run: |
          [ -z "${SKIP_APK:-}" ] || { echo "Android build skipped (see the previous step)."; exit 0; }
          if [ -n "$KEYSTORE_B64" ] && [ -n "$TS_ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$TS_ANDROID_KEY_ALIAS" ] && [ -n "$TS_ANDROID_KEY_PASSWORD" ]; then
            ks="$(mktemp)"
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
            export TS_ANDROID_KEYSTORE="$ks"
            echo "Signing key present: the APK will be signed."
          else
            unset TS_ANDROID_KEYSTORE TS_ANDROID_KEYSTORE_PASSWORD TS_ANDROID_KEY_ALIAS TS_ANDROID_KEY_PASSWORD
            echo "Signing skipped: the TS_ANDROID_* secrets are not all set. The APK will be unsigned and named -unsigned.apk."
          fi
          android/tools/make-apk.sh "${TAG#v}"
      - name: Remove the keystore file
        if: always()
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ]; then rm -f "$KEYSTORE_FILE"; fi
      - name: Attach the APK to the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
        run: |
          [ -z "${SKIP_APK:-}" ] || { echo "Nothing to attach."; exit 0; }
          test -n "$RELEASE_TOKEN" || { echo "secret RELEASE_TOKEN is not set"; exit 1; }
          curl -fsS "$API/releases/tags/$TAG" -H "Authorization: token $RELEASE_TOKEN" -o release.json
          id="$(grep -o '"id":[0-9]*' release.json | head -1 | cut -d: -f2)"
          test -n "$id" || { echo "no release id in the answer"; exit 1; }
          for f in android/build/dist/*; do
            curl -fsS -X POST "$API/releases/$id/assets?name=$(basename "$f")" \
              -H "Authorization: token $RELEASE_TOKEN" -F "attachment=@$f" -o /dev/null
            echo "attached $(basename "$f")"
          done
