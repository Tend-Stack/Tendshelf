name: Tendshelf nightly

# The full checks that do not fit every push, in two jobs that run side by side on the two runners:
# "gate" (the race suite without a browser, then the real-ffmpeg media tests) and "browser" (every
# Chromium test in a pinned Chromium, split into steps that do not overlap: the general browser tests,
# the full screenshot matrix, the accessibility audit and the page weight). Operator decision 2026-11-01: a nightly failure
# is fixed before the next feature push. Runs on the amd64 runner because Chrome for Testing has no
# linux-arm64 build. No publishing, no deployment.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tendshelf-nightly
  cancel-in-progress: true

env:
  # Pinned Chrome for Testing build; Google publishes no checksum, so the SHA-256 was recorded by
  # the lead when this version was chosen. Bump both together.
  CFT_VERSION: "156.0.8078.80"
  CFT_SHA256: "b711c720f774be355197f32edf37e0651418ba036d92446ee2da19ac017540a7"

jobs:
  gate:
    name: race suite and real media
    runs-on: [tend-ci, linux-amd64]
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
    steps:
      - name: Check out the exact candidate
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          persist-credentials: false
      - name: Install the Go version declared by the module
        uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # setup-go v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install make, the C compiler for -race and ffmpeg
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make gcc libc6-dev ffmpeg
      - name: Record toolchain and candidate identity
        run: |
          git rev-parse HEAD
          go version
          ffmpeg -version | head -1
      - name: Gate (gofmt, vet, race tests; the browser tests skip)
        run: make check
      - name: Real-ffmpeg media, scan and cover tests
        run: |
          make test-media
          make test-scan-real
          make test-mediajobs-real

  browser:
    name: browser tests, screenshot matrix, accessibility
    runs-on: [tend-ci, linux-amd64]
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
    timeout-minutes: 150
    env:
      CI: "true"
    steps:
      - name: Check out the exact candidate
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          persist-credentials: false
      - name: Install the Go version declared by the module
        uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # setup-go v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install make, unzip and ffmpeg (the upload tests probe real files)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make unzip curl ca-certificates ffmpeg
      - name: Install the pinned Chromium and its libraries
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
          echo "${CFT_SHA256}  chrome.zip" | sha256sum -c -
          unzip -q chrome.zip
          # deb.deps lines look like "libnss3 (>= 2:3.35)" or "libasound2 | libasound2t64": keep the
          # first name; when it has no candidate on Ubuntu 24.04, try its t64 rename, appended
          # (libasound2t64) or after the soname number (libcurl3-gnutls -> libcurl3t64-gnutls).
          # Capture apt-cache's output before searching it: with pipefail, `apt-cache | grep -q`
          # fails when grep stops early and apt-cache dies of SIGPIPE.
          has() { local out; out=$(apt-cache policy "$1"); grep -q 'Candidate: [0-9]' <<<"$out"; }
          pkgs=""
          for p in $(sed -e 's/ *|.*//' -e 's/ *(.*//' chrome-linux64/deb.deps); do
            found=""
            for c in "$p" "${p}t64" "$(sed -E 's/([0-9])-/\1t64-/' <<<"$p")"; do
              if has "$c"; then found=$c; break; fi
            done
            if [ -z "$found" ]; then echo "no package for $p"; exit 1; fi
            pkgs="$pkgs $found"
          done
          apt-get install -y --no-install-recommends $pkgs
          echo "TENDSHELF_TEST_BROWSER=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Record toolchain and candidate identity
        run: |
          git rev-parse HEAD
          go version
          "$TENDSHELF_TEST_BROWSER" --version
      - name: Browser tests (everything except the three sets below)
        run: make browser
      # A failure above must not hide what these three would find: the run still fails, with all of it.
      - name: Browser screenshot matrix (all themes and widths)
        if: ${{ !cancelled() }}
        run: make visual-full
      - name: Accessibility audit (WCAG 2.2 AA, contrast theme 7:1)
        if: ${{ !cancelled() }}
        run: make a11y
      - name: Page weight at four widths
        if: ${{ !cancelled() }}
        run: make page-weight
