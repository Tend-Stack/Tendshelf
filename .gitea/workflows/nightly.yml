name: Tendshelf nightly

# The full checks that do not fit every push: the race suite, the real-ffmpeg media tests and the
# browser screenshot matrix in a pinned Chromium. Operator decision 2026-11-01: a nightly failure
# is fixed before the next feature push. Runs on the amd64 runner because Chrome for Testing has no
# linux-arm64 build. No publishing, no deployment.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tendshelf-nightly
  cancel-in-progress: true

env:
  # Pinned Chrome for Testing build; Google publishes no checksum, so the SHA-256 was recorded by
  # the lead when this version was chosen. Bump both together.
  CFT_VERSION: "156.0.8078.80"
  CFT_SHA256: "b711c720f774be355197f32edf37e0651418ba036d92446ee2da19ac017540a7"

jobs:
  nightly:
    name: race suite, real media, browser matrix
    runs-on: [tend-ci, linux-amd64]
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Check out the exact candidate
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          persist-credentials: false
      - name: Install the Go version declared by the module
        uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # setup-go v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install make, the C compiler for -race, ffmpeg and unzip
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make gcc libc6-dev ffmpeg unzip curl ca-certificates
      - name: Install the pinned Chromium and its libraries
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
          echo "${CFT_SHA256}  chrome.zip" | sha256sum -c -
          unzip -q chrome.zip
          # deb.deps lines look like "libnss3 (>= 2:3.35)" or "libasound2 | libasound2t64": keep the
          # first name, and on Ubuntu 24.04 use its t64 rename when the old name has no candidate.
          # Capture apt-cache's output before searching it: with pipefail, `apt-cache | grep -q`
          # fails when grep stops early and apt-cache dies of SIGPIPE.
          has() { local out; out=$(apt-cache policy "$1"); grep -q 'Candidate: [0-9]' <<<"$out"; }
          pkgs=""
          for p in $(sed -e 's/ *|.*//' -e 's/ *(.*//' chrome-linux64/deb.deps); do
            if has "$p"; then pkgs="$pkgs $p"
            elif has "${p}t64"; then pkgs="$pkgs ${p}t64"
            else echo "no package for $p"; exit 1
            fi
          done
          apt-get install -y --no-install-recommends $pkgs
          echo "TENDSHELF_TEST_BROWSER=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Record toolchain and candidate identity
        run: |
          git rev-parse HEAD
          go version
          ffmpeg -version | head -1
          "$TENDSHELF_TEST_BROWSER" --version
      - name: Gate (gofmt, vet, race tests)
        run: make check
      - name: Real-ffmpeg media, scan and cover tests
        run: |
          make test-media
          make test-scan-real
          make test-mediajobs-real
      - name: Browser screenshot matrix (all themes and widths)
        run: make visual-full
