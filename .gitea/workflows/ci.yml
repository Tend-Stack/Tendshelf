name: Tendshelf checks

# The AGENTS.md gates on every push and PR: make check (gofmt, vet, race tests) and the
# CGO-free build. No Node anywhere; no publishing or deployment here. Release binaries are built only
# when a v* tag is pushed, by release.yml.
on:
  push:
    branches: [main]
    # A push that changes only these never reaches the server's Go code, so it does not start the 30 minute race suite.
    # NOTICES.md is not listed: reader_settings_test.go reads it. android/ and desktop/ have their own workflows.
    paths-ignore:
      - "docs/**"
      - "android/**"
      - "desktop/**"
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  pull_request:
    branches: [main]
    # A push that changes only these never reaches the server's Go code, so it does not start the 30 minute race suite.
    # NOTICES.md is not listed: reader_settings_test.go reads it. android/ and desktop/ have their own workflows.
    paths-ignore:
      - "docs/**"
      - "android/**"
      - "desktop/**"
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read

# The server, Desktop and Android workflows share one queue, so one push runs one job at a time and they never slow
# each other's timing-sensitive tests. Runs are not cancelled (one workflow must not cancel another); a newer push's
# waiting run replaces an older waiting one.
concurrency:
  group: tendshelf-side-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: make check and make build
    runs-on: [tend-ci, linux-arm64]
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Check out the exact candidate
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          persist-credentials: false
      - name: Install the Go version declared by the module
        uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # setup-go v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install make and the C compiler the race detector needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make gcc libc6-dev
      - name: Generated files are current
        run: make generate && git diff --exit-code && test -z "$(git status --porcelain)"
      - name: Record toolchain and candidate identity
        run: |
          git rev-parse HEAD
          go version
          uname -m
      - name: Gate (gofmt, go vet, go test -race)
        run: make check
      - name: CGO-free build
        run: make build
