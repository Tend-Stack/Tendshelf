name: Feature request
description: Tell us about a problem you have, and we will look for the smallest good answer
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution. Please read
        [What Tendshelf will not do](https://github.com/Tend-Stack/Tendshelf/blob/main/docs/vision.md#what-tendshelf-will-not-do)
        first. Please do not paste tokens, links or server addresses.
  - type: textarea
    id: problem
    attributes:
      label: The problem you have
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How you work around it today
    validations:
      required: true
  - type: textarea
    id: others
    attributes:
      label: Who else it helps
      description: For example a family member, people with a large library, people who listen in the car.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: An idea for a solution (optional)
