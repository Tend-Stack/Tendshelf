<!doctype html>
<!-- Template for make-icon.sh: __FILL__ is the icon's own background colour, __SVG__ the file address of the handoff's icon.
     The icon is drawn at 1024 px on a page of its own colour, so the rounded corners fill in and iOS can mask the square. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; overflow: hidden; background: __FILL__; }
  img { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body><img src="__SVG__" alt=""></body>
</html>
