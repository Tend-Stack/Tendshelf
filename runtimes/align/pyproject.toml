# Lock-generation input for the Linux CPU installer; not an app dependency.
[project]
name = "tendshelf-align-runtime"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0+cpu",
  "torchaudio==2.8.0+cpu",
  "transformers==5.19.0",
  "numpy==2.5.3",
  "safetensors==0.8.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
