<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile redesign: board for approval (decision 0021)</title>
<link rel="stylesheet" href="../tendshelf-handoff/design-system/tokens.css">
<link rel="stylesheet" href="../tendshelf-handoff/design-system/components/bundle.css">
<style>
/* ---- Board only: self-hosted fonts by relative path (no Google Fonts), frames, theme switch, cover art. ---- */
@font-face { font-family: "Fraunces"; font-weight: 100 900; src: url("../../../internal/web/static/fonts/Fraunces-Variable.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-weight: 400; src: url("../../../internal/web/static/fonts/FiraSans-Regular.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-weight: 500; src: url("../../../internal/web/static/fonts/FiraSans-Medium.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-weight: 600; src: url("../../../internal/web/static/fonts/FiraSans-SemiBold.woff2") format("woff2"); }
:root { --radius-control: 12px; } /* decision 0004: the app's controls use 12 px corners, not the handoff's pills */
.ts-btn, .ts-iconbtn, .ts-seg { border-radius: var(--radius-control); }
.bd-body { margin: 0; padding: 24px 0; background: #6b6259; font-family: "Fira Sans", system-ui, sans-serif; color: #fff; }
.bd-defs { position: absolute; }
.bd-head { margin-bottom: 24px; padding: 0 24px; }
.bd-h1 { margin: 0 0 4px; font: 600 22px/28px "Fira Sans", sans-serif; }
.bd-p { margin: 0 0 12px; }
.bd-radio { position: absolute; opacity: 0; }
.bd-switch { display: flex; flex-wrap: wrap; gap: 8px; }
.bd-switch label { padding: 8px 16px; border: 1px solid #fff; border-radius: 12px; cursor: pointer; }
#bd-dark:checked ~ .bd-head label[for="bd-dark"], #bd-light:checked ~ .bd-head label[for="bd-light"],
#bd-sepia:checked ~ .bd-head label[for="bd-sepia"], #bd-contrast:checked ~ .bd-head label[for="bd-contrast"] { background: #fff; color: #000; }
.bd-radio:focus-visible ~ .bd-head .bd-switch { outline: 2px solid #fff; outline-offset: 4px; }
.bd-theme { display: none; background: transparent; }
#bd-dark:checked ~ .bd-theme--dark, #bd-light:checked ~ .bd-theme--light,
#bd-sepia:checked ~ .bd-theme--sepia, #bd-contrast:checked ~ .bd-theme--contrast { display: block; }
.bd-row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; padding: 0 24px; }
.bd-fig { margin: 0 0 40px; max-width: 100%; overflow-x: auto; }
.bd-cap { margin-bottom: 8px; max-width: 390px; font: 500 14px/20px "Fira Sans", sans-serif; color: #fff; }
.bd-desk ~ .bd-cap, .bd-fig:has(.bd-desk) .bd-cap { max-width: none; }
.bd-phone { container: frame / inline-size; position: relative; width: 390px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); border-radius: 24px; overflow: hidden; }
.bd-main { padding: 24px 20px 96px; }
.bd-tabbar { position: absolute; left: 0; right: 0; bottom: 0; }
.bd-desk { container: frame / inline-size; display: flex; width: 1440px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); }
.bd-side { flex: none; border-right: 1px solid var(--line); }
.bd-side .ts-side__brand { text-decoration: none; }
.bd-logo { width: 2rem; height: 2rem; }
.bd-main--desk { flex: 1; min-width: 0; padding: 24px 20px 64px; }
.bd-art { display: block; width: 100%; height: 100%; }
.bd-avatar { background: #5a4029; color: #f6ead9; flex: none; }
.bd-back { align-self: flex-start; margin-left: -12px; color: var(--ink-muted); }
.bd-lead { margin: 4px 0 8px; }
.bd-fade { opacity: 0.5; }

/* ---- Already in the app, copied so the board stands alone (pages-home.css, pages-library.css, pages-shelves.css,
   pages-me.css, utilities.css). Viewport media queries read the frame here, as @container frame. ---- */
.ts-num { font-variant-numeric: tabular-nums; }
.ts-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ts-truncate { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ts-clamp-2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.ts-cover { display: block; }
.ts-cover--fill { inline-size: 100%; block-size: auto; aspect-ratio: 1; }
.ts-cover--36 { inline-size: 2.25rem; block-size: 2.25rem; }
.ts-cover--24 { inline-size: 1.5rem; block-size: 1.5rem; }
.ts-cover__line { position: absolute; inset: auto 0 0 0; height: 0.1875rem; background: var(--line); }
.ts-cover__line-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent-fill); }
.ts-card__cover { display: block; }
.ts-home { display: flex; flex-direction: column; }
.ts-home__title { margin: 0 0 var(--space-8); }
.ts-home__row { margin-top: var(--space-8); }
.ts-home__rowhead { display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); min-height: var(--size-tap); }
.ts-home__rowhead .section, .ts-home__rowhead .ts-overline { margin: 0; }
.ts-home__rowhead .ts-btn--quiet { margin-right: calc(var(--space-12) * -1); }
.ts-home__cards { display: flex; gap: var(--space-16); margin-top: var(--space-8); padding-bottom: var(--space-8); }
.ts-home__cards--three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; }
.ts-home__hero { margin-top: var(--space-16); padding-bottom: var(--space-24); border-bottom: 1px solid var(--line); }
.ts-hero__top { display: grid; grid-template-columns: min(7.75rem, 40%) minmax(0, 1fr); gap: var(--space-16); align-items: start; }
.ts-hero__text { display: contents; }
.ts-hero__cover { display: block; box-shadow: var(--shadow-cover); border-radius: var(--radius-cover); }
.ts-hero__head { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
.ts-hero__title a { overflow-wrap: anywhere; display: flex; align-items: center; min-height: var(--size-tap); color: inherit; text-decoration: none; }
.ts-hero__progress, .ts-hero__actions { grid-column: 1 / -1; display: flex; flex-direction: column; gap: var(--space-8); }
.ts-hero__actions { flex-direction: row; gap: var(--space-12); }
.ts-hero__actions .ts-btn--primary { flex: 1; text-decoration: none; }
.ts-hero__chapters { display: none; text-decoration: none; }
@container frame (width >= 768px) {
  .ts-home__hero { margin-top: 0; margin-bottom: var(--space-8); padding: var(--space-24); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
  .ts-hero__top { grid-template-columns: 13.75rem minmax(0, 1fr); gap: 0 var(--space-32); }
  .ts-hero__text { display: flex; flex-direction: column; gap: var(--space-16); min-width: 0; }
  .ts-hero__actions .ts-btn--primary { flex: none; }
  .ts-hero__chapters { display: inline-flex; }
  .ts-hero__title { font-size: 2rem; line-height: 2.375rem; }
}
.ts-shelf-list { list-style: none; margin: 0; padding: 0; }
.ts-shelf-row { border-bottom: 1px solid var(--line); text-decoration: none; }
.ts-shelf-row__stack { display: flex; flex: none; min-width: 5.25rem; padding-right: var(--space-8); }
.ts-shelf-row__stack .ts-cover { margin-right: -0.75rem; border-radius: var(--radius-sm); box-shadow: 0 0 0 2px var(--ground); }
.ts-me { display: flex; flex-direction: column; padding-bottom: var(--space-32); }
.ts-me__title, .ts-me__lead { margin: 0; }
.ts-me__lead, .ts-me__foot { color: var(--ink-muted); }
.ts-me__sub { display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap; }
.ts-me__row { display: flex; align-items: center; gap: 0.875rem; min-height: 3.5rem; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.ts-me__rowtext { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.ts-me__chev { width: 0.5rem; height: 0.5rem; margin-right: 0.375rem; border: solid var(--ink-muted); border-width: 2px 2px 0 0; transform: rotate(45deg); }
.ts-me__device { min-height: 3.75rem; }
.ts-me__deviceicon { display: flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; border-radius: 50%; background: var(--raised); color: var(--ink-muted); }
.ts-me__deviceicon .ts-icon { width: 1.25rem; height: 1.25rem; }
.ts-me__others { padding-bottom: var(--space-8); }
.ts-me__others .ts-btn { padding-inline: 0; }
.ts-me__signout { max-width: 24rem; margin-top: var(--space-8); }
.ts-me__foot { max-width: 24rem; margin: var(--space-4) 0 0; text-align: center; }
.ts-stats { box-sizing: border-box; margin: 0; padding: 1.125rem; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.ts-stats__title { margin: 0; }
.ts-stats__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-12); margin: 0.875rem 0 0; }
.ts-stats__label { margin: 0; color: var(--ink-muted); }
.ts-stats__value { margin: 0.125rem 0 0; font-size: 1.375rem; line-height: 1.75rem; }
.ts-stats__days { max-width: 22rem; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.375rem; margin-top: var(--space-16); }
.ts-stats__day { display: flex; flex-direction: column; align-items: center; gap: 0.375rem; }
.ts-stats__letter { color: var(--ink-muted); }
.ts-stats__mark { display: block; box-sizing: border-box; width: 1.75rem; height: 1.75rem; border-radius: 0.875rem; background: transparent; border: 0.09375rem solid var(--line); }
.ts-stats__day--listened { background: var(--accent-fill); border: 0; }
.ts-stats__day--today { border: 0.09375rem dashed var(--line-strong); }
.ts-stats__note { margin: var(--space-12) 0 0; color: var(--ink-muted); }
.ts-dash__more { display: inline-flex; align-items: center; min-height: var(--size-tap); color: var(--accent); text-decoration: none; }

/* ---- New: port these to internal/web/static/css/pages-profile.css (decision 0021). rem and tokens only. ---- */
/* The page measures itself, not the screen (decision 0010, point 4): with the player panel open it is one column. */
.ts-profile { container: profile / inline-size; display: flex; flex-direction: column; gap: var(--space-24); padding-bottom: var(--space-32); }
.ts-profile__head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: var(--space-12); row-gap: var(--space-4); align-items: center; }
.ts-profile__head > .ts-avatar { grid-row: 1 / span 2; }
.ts-profile__who { display: contents; }
.ts-profile__name { grid-column: 2; margin: 0; overflow-wrap: anywhere; }
.ts-profile__head .ts-me__sub { grid-column: 2 / -1; grid-row: 2; }
.ts-profile__settings { grid-column: 3; grid-row: 1; margin-right: calc(var(--space-12) * -1); text-decoration: none; }
.ts-profile__cols { display: flex; flex-direction: column; gap: var(--space-32); }
.ts-profile__books, .ts-profile__side { display: flex; flex-direction: column; gap: var(--space-24); min-width: 0; }
.ts-profile__books .ts-home__hero { margin-top: 0; }
.ts-profile__empty { margin-inline: 0; padding-inline: 0; align-items: flex-start; text-align: start; }
/* A card of the side column. */
.ts-profile__card { padding: var(--space-4) 1.125rem var(--space-8); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.ts-profile__card .ts-row:last-child, .ts-profile__card li:last-child .ts-row, .ts-profile__card .ts-me__row:last-child { border-bottom: 0; }
.ts-profile__card .ts-shelf-row__stack .ts-cover { box-shadow: 0 0 0 2px var(--surface); }
.ts-profile__group { display: block; margin: 0; padding: var(--space-16) 0 var(--space-4); }
.ts-profile .ts-stats__grid { align-items: end; }
.ts-stats__links { display: flex; flex-direction: column; align-items: flex-start; margin-top: var(--space-4); }

/* The books in progress. A phone row: cover, words, then the one resume control. Room for covers: a grid of
   tiles with the control on the cover's corner. One control per book, the format used last. */
.ts-pbooks { list-style: none; margin: 0; padding: 0; }
.ts-pbook { container-type: inline-size; position: relative; display: flex; align-items: center; gap: var(--space-12); padding-block: var(--space-12); border-bottom: 1px solid var(--line); }
.ts-pbook .ts-card { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); grid-template-rows: 1fr auto auto 1fr; column-gap: var(--space-12); flex: 1; min-width: 0; }
.ts-pbook .ts-card__cover { grid-row: 1 / -1; align-self: center; }
.ts-pbook .ts-cover, .ts-profile__done .ts-cover { box-shadow: var(--shadow-cover); }
.ts-pbook .ts-card__title { grid-column: 2; grid-row: 1; align-self: end; font-family: var(--font-serif); font-size: 1rem; line-height: 1.375rem; }
.ts-pbook .ts-card__author { grid-column: 2; }
.ts-pbook__left { font-variant-numeric: tabular-nums; }
.ts-pbook > .ts-iconbtn { flex: none; }
/* The phone shows five rows; See all opens the library's Unfinished list. */
.ts-pbook:nth-child(n+6) { display: none; }
.ts-pbook:last-child, .ts-pbook:nth-child(5) { border-bottom: 0; }
/* Finished lately: covers only, three on a phone. */
.ts-profile__done { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-16); margin-top: var(--space-8); }
.ts-profile__done > :nth-child(n+4) { display: none; }

@container profile (width >= 36rem) {
  .ts-profile__name { font-size: 2rem; line-height: 2.375rem; }
  .ts-pbooks { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: var(--space-24) var(--space-16); margin-top: var(--space-8); }
  .ts-pbook { display: block; padding: 0; border-bottom: 0; }
  .ts-pbook:nth-child(n+6) { display: block; }
  .ts-pbook .ts-card { display: flex; flex-direction: column; gap: 0.125rem; }
  .ts-pbook .ts-card__title { align-self: auto; margin-top: var(--space-8); }
  .ts-pbook > .ts-iconbtn { position: absolute; top: calc(100cqi - var(--size-tap) - var(--space-12)); right: var(--space-8); box-shadow: var(--shadow-float); }
  .ts-profile__done { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .ts-profile__done > :nth-child(n+4) { display: flex; }
  .ts-profile__done .ts-card__title { font-size: 0.875rem; line-height: 1.25rem; }
}
/* One column with room to spare (768, 1024, or the player panel open): the side cards pair up. */
@container profile (36rem <= width < 60rem) {
  .ts-profile__side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .ts-profile__account, .ts-profile__side .ts-me__signout, .ts-profile__side .ts-me__foot { grid-column: 1 / -1; }
}
/* Two columns only when the page really has the room (61 rem at 1280 px with the sidebar). */
@container profile (width >= 60rem) {
  .ts-profile__cols { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: var(--space-32); align-items: start; }
}
/* Your devices: nearly identical sign-ins fold into one line (add to pages-me.css). */
.ts-me__devgroup > summary { cursor: pointer; list-style: none; }
.ts-me__devgroup > summary::-webkit-details-marker { display: none; }
.ts-me__devgroup[open] > summary .ts-me__chev { transform: rotate(135deg); }
.ts-me__devone { padding-left: 3.375rem; }

</style>
</head>
