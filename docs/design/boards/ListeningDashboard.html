<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening dashboard: board for approval (decision 0014)</title>
<link rel="stylesheet" href="../tendshelf-handoff/design-system/tokens.css">
<link rel="stylesheet" href="../tendshelf-handoff/design-system/components/bundle.css">
<style>
/* ---- Board only: self-hosted fonts by relative path (no Google Fonts), frames, theme switch. ---- */
@font-face { font-family: "Fraunces"; font-weight: 100 900; src: url("../../../internal/web/static/fonts/Fraunces-Variable.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-weight: 400; src: url("../../../internal/web/static/fonts/FiraSans-Regular.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-weight: 500; src: url("../../../internal/web/static/fonts/FiraSans-Medium.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-weight: 600; src: url("../../../internal/web/static/fonts/FiraSans-SemiBold.woff2") format("woff2"); }
:root { --radius-control: 12px; } /* decision 0004: the app's controls use 12 px corners, not the handoff's pills */
.ts-seg, .ts-iconbtn { border-radius: var(--radius-control); }
.ts-seg__item { border-radius: calc(var(--radius-control) - 3px); }
.bd-body { margin: 0; padding: 24px; background: #6b6259; font-family: "Fira Sans", system-ui, sans-serif; color: #fff; }
.bd-head { margin-bottom: 24px; }
.bd-h1 { margin: 0 0 4px; font: 600 22px/28px "Fira Sans", sans-serif; }
.bd-p { margin: 0 0 12px; }
.bd-radio { position: absolute; opacity: 0; }
.bd-switch { display: flex; gap: 8px; }
.bd-switch label { padding: 8px 16px; border: 1px solid #fff; border-radius: 12px; cursor: pointer; }
#bd-dark:checked ~ .bd-head label[for="bd-dark"], #bd-light:checked ~ .bd-head label[for="bd-light"],
#bd-sepia:checked ~ .bd-head label[for="bd-sepia"], #bd-contrast:checked ~ .bd-head label[for="bd-contrast"] { background: #fff; color: #000; }
.bd-radio:focus-visible ~ .bd-head .bd-switch { outline: 2px solid #fff; outline-offset: 4px; }
.bd-theme { display: none; background: transparent; }
#bd-dark:checked ~ .bd-theme--dark, #bd-light:checked ~ .bd-theme--light,
#bd-sepia:checked ~ .bd-theme--sepia, #bd-contrast:checked ~ .bd-theme--contrast { display: block; }
.bd-row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
.bd-fig { margin: 0 0 40px; }
.bd-cap { margin-bottom: 8px; font: 500 14px/20px "Fira Sans", sans-serif; color: #fff; }
.bd-phone { position: relative; width: 390px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); border-radius: 24px; overflow: hidden; }
.bd-main { padding: 24px 20px 160px; }
.bd-mini { position: absolute; left: 8px; right: 8px; bottom: 80px; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px; border-radius: 12px; background: var(--raised); box-shadow: var(--shadow-float); }
.bd-minicover { width: 40px; height: 40px; border-radius: 4px; background: var(--brand-walnut); }
.bd-tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; display: flex; justify-content: space-around; align-items: center; background: var(--surface); border-top: 1px solid var(--line); }
.bd-tab, .bd-railitem { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 13px/16px var(--font-sans); color: var(--ink-muted); }
.bd-tab--on, .bd-railitem--on { color: var(--accent); }
.bd-dot { width: 22px; height: 22px; border-radius: 6px; border: 1.75px solid currentColor; }
.bd-desk { display: flex; width: 1440px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); border-radius: 12px; overflow: hidden; }
.bd-rail { flex: none; width: 88px; display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 32px; border-right: 1px solid var(--line); background: var(--surface); }
.bd-main--desk { flex: 1; min-width: 0; padding: 32px 32px 64px; }

/* ---- Proposed css/pages-listening.css (decision 0014). rem sizes, tokens only. ---- */
.ts-dash { display: flex; flex-direction: column; gap: var(--space-16); max-width: 46rem; padding-bottom: var(--space-32); }
.ts-dash__back { display: inline-flex; align-items: center; gap: var(--space-8); align-self: flex-start; min-height: 2.75rem; color: var(--ink-muted); text-decoration: none; font-size: 0.9375rem; }
.ts-dash__back .ts-icon { width: 1.25rem; height: 1.25rem; }
.ts-dash__title, .ts-dash__lead { margin: 0; }
.ts-dash__lead { margin-top: calc(-1 * var(--space-12)); }
.ts-dash__muted { color: var(--ink-muted); }
.ts-dash__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-12); }
.ts-dash__range .ts-seg__item { display: inline-flex; align-items: center; color: var(--ink-muted); text-decoration: none; }
.ts-dash__range .ts-seg__item[aria-current="page"] { background: var(--raised); color: var(--ink); font-weight: 600; }
.ts-dash__period { display: flex; align-items: center; gap: var(--space-4); }
.ts-dash__period .ts-iconbtn { color: var(--ink); }
.ts-dash__period .ts-icon { width: 1.25rem; height: 1.25rem; }
.ts-dash__periodlabel { min-width: 7.5rem; text-align: center; font-variant-numeric: tabular-nums; }
.ts-dash__navgap { width: var(--size-tap); }
.ts-dash__nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-16) var(--space-12); margin: 0; padding: 1.125rem; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.ts-dash__numlabel { margin: 0; color: var(--ink-muted); }
.ts-dash__num { margin: 0.125rem 0 0; font-size: 1.375rem; line-height: 1.75rem; }
.ts-dash__grid { display: flex; flex-direction: column; gap: var(--space-16); }
.ts-dash__card { box-sizing: border-box; min-width: 0; padding: 1.125rem; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.ts-dash__h { margin: 0; }
.ts-dash__say { margin: var(--space-4) 0 var(--space-16); color: var(--ink-muted); }
.ts-dash__note { margin: var(--space-8) 0 0; color: var(--ink-muted); }
.ts-dash__sub { display: block; margin: var(--space-16) 0 var(--space-4); }
.ts-dash__h + .ts-dash__sub { margin-top: var(--space-12); }
/* Charts: the SVG draws bars and lines only; every word is HTML beside it, so nothing scales or stretches text. */
.ts-chart { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: var(--space-8); }
.ts-chart__ticks { display: grid; grid-template-rows: 0.25rem 0 4.75rem 0 1fr; height: 10rem; color: var(--ink-muted); }
.ts-chart__tick { height: 0; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ts-chart__plot { display: block; width: 100%; height: 10rem; overflow: visible; }
.ts-chart__grid { stroke: var(--line); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.ts-chart__base { stroke: var(--line-strong); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.ts-chart__night { fill: var(--raised); }
.ts-chart__bar { stroke: var(--accent-fill); stroke-width: 0.375rem; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.ts-chart--wide .ts-chart__bar { stroke-width: 0.75rem; }
.ts-chart__x { grid-column: 2; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-top: var(--space-4); color: var(--ink-muted); }
.ts-chart__xl { display: flex; flex-direction: column; align-items: center; justify-self: center; gap: 0.125rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ts-chart--edge .ts-chart__xl { align-items: flex-start; justify-self: start; }
.ts-chart__icon { width: 1rem; height: 1rem; }
.ts-dash__parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-12); margin: var(--space-16) 0 0; padding: 0; list-style: none; }
.ts-dash__parts li { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--space-8); align-items: start; }
.ts-dash__particon { grid-row: span 2; color: var(--ink-muted); }
.ts-dash__particon .ts-icon { width: 1.25rem; height: 1.25rem; }
.ts-dash__parttext { display: flex; flex-direction: column; }
.ts-dash__parttime { grid-column: 2; }
/* Heat grid: fixed cells (1 SVG unit = 1 CSS px at the default text size), sideways scroll on a phone that starts at
   the newest week (direction: rtl), a sequential one-hue ramp with a numeric key. */
.ts-heat__scroll { overflow-x: auto; direction: rtl; padding-bottom: var(--space-4); }
.ts-heat__scroll:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
.ts-heat__svg { direction: ltr; display: block; width: 100%; min-width: 41.75rem; max-width: 48rem; height: auto; margin: 0 auto 0 0; }
.ts-heat__label { fill: var(--ink-muted); font: 500 0.8125rem/1 var(--font-sans); }
.ts-heat__c0 { fill: var(--raised); background: var(--raised); }
.ts-heat__c1, .ts-heat__c2, .ts-heat__c3, .ts-heat__c4 { fill: var(--accent-fill); background: var(--accent-fill); }
.ts-heat__c1 { fill-opacity: 0.3; }
.ts-heat__c2 { fill-opacity: 0.55; }
.ts-heat__c3 { fill-opacity: 0.8; }
.ts-heat__swatch.ts-heat__c1 { opacity: 0.3; }
.ts-heat__swatch.ts-heat__c2 { opacity: 0.55; }
.ts-heat__swatch.ts-heat__c3 { opacity: 0.8; }
.ts-heat__key { display: flex; flex-wrap: wrap; gap: var(--space-8) var(--space-16); margin: var(--space-12) 0 0; padding: 0; list-style: none; color: var(--ink-muted); }
.ts-heat__key li { display: flex; align-items: center; gap: 0.375rem; }
.ts-heat__swatch { display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 0.125rem; }
/* Most listened: name, time, a thin square meter scaled to the first row. */
.ts-dash__top { margin: 0; padding: 0; list-style: none; }
.ts-dash__toprow { display: flex; align-items: center; gap: var(--space-12); min-height: 3rem; padding: var(--space-4) 0; }
.ts-dash__toptext { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 0.125rem; }
.ts-dash__topname { color: var(--ink); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.ts-dash__topname { min-height: 1.5rem; }
.ts-dash__toptime { flex: none; font-variant-numeric: tabular-nums; }
.ts-dash__meter { display: block; width: 100%; height: 0.25rem; margin-top: 0.25rem; }
.ts-dash__track { fill: var(--raised); }
.ts-dash__fill { fill: var(--accent-fill); }
/* Finished: covers flow in, newest first (BRAND: celebrate with covers, not words). */
.ts-dash__done { display: flex; gap: var(--space-12); margin: var(--space-12) 0 0; padding: 0 0 var(--space-4); list-style: none; overflow-x: auto; }
.ts-dash__done li { flex: none; width: 5.5rem; }
.ts-dash__donelink { display: flex; flex-direction: column; gap: var(--space-4); color: var(--ink); text-decoration: none; }
.ts-dash__donetitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Board stand-in for components.Cover. */
.ts-dash__cover { flex: none; display: flex; align-items: center; justify-content: center; width: 2.25rem; height: 2.25rem; border-radius: var(--radius-cover); background: var(--brand-walnut); color: var(--brand-paper); font: 500 0.875rem/1 var(--font-serif); }
.ts-dash__cover--lg { width: 5.5rem; height: 5.5rem; padding: 0.375rem; box-sizing: border-box; font-size: 0.8125rem; line-height: 1.1; text-align: center; overflow: hidden; }
@media (min-width: 768px) {
  .ts-dash__nums { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .ts-dash__parts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (min-width: 1024px) {
  .ts-dash { max-width: var(--size-content-max); }
  .ts-dash__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-24); }
  .ts-dash__card--wide { grid-column: 1 / -1; }
  .ts-dash__parts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* The board frames are fixed-width boxes, so the media queries above cannot see them: the desktop frame
   restates the wide rules. The app uses the media queries only. */
.bd-desk .ts-dash { max-width: var(--size-content-max); }
.bd-desk .ts-dash__nums { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.bd-desk .ts-dash__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-24); }
.bd-desk .ts-dash__card--wide { grid-column: 1 / -1; }
.bd-phone .ts-dash__nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bd-phone .ts-dash__parts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bd-phone .ts-dash__grid { display: flex; }
.bd-phone .ts-dash { max-width: none; }

</style>
</head>
