<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyes-free</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Fira+Sans:wght@400;500;600&family=Fira+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
<style>body{margin:0}</style>
</head>
<body>
<!-- Static snapshot of the design board "EyesFreePhone" (390 x 844). Reference markup, not production code. -->


<div data-theme="dark" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-sans); --cover-accent: #9ccbc4; --on-cover-accent: #14110e">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 12px 8px 0">
    <button type="button" class="ts-btn ts-btn--quiet" style="color: var(--ink)"><svg class="ts-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"></path><path d="M12 6v13"></path></svg>Back to reading</button>
    <span class="ts-overline" style="padding-right: 12px">Eyes-free</span>
  </div>
  <div style="padding: 16px 24px 0; display: flex; flex-direction: column; gap: 4px">
    <h1 class="title-2" style="margin: 0">The Lighthouse Keeper's Daughter</h1>
    <p class="body-lg ts-num" style="margin: 0; color: var(--ink-muted)">Chapter 12 · 18 min left in chapter</p>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; top: 196px; bottom: 100px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1.6fr 1fr; gap: 12px">
    <button type="button" class="ts-eyesfree__zone"><svg class="ts-icon" style="width: 48px; height: 48px; stroke-width: 1.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"></path><path d="M4.5 3.5v4h4"></path></svg>Back 30 s</button>
    <button type="button" class="ts-eyesfree__zone"><svg class="ts-icon" style="width: 48px; height: 48px; stroke-width: 1.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5"></path><path d="M19.5 3.5v4h-4"></path></svg>Forward 30 s</button>
    <button type="button" class="ts-eyesfree__zone ts-eyesfree__zone--main" style="grid-column: 1 / span 2; font-size: 26px; line-height: 32px" aria-label="Pause"><svg class="ts-icon ts-icon--fill" style="width: 72px; height: 72px" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>Pause</button>
    <button type="button" class="ts-eyesfree__zone"><svg class="ts-icon" style="width: 44px; height: 44px;" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h11v16.5L12 16.8l-5.5 3.7z"></path></svg>Bookmark</button>
    <button type="button" class="ts-eyesfree__zone"><svg class="ts-icon" style="width: 44px; height: 44px;" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"></path></svg>Sleep</button>
  </div>
  <p class="body" style="position: absolute; left: 24px; right: 24px; bottom: 28px; margin: 0; text-align: center; color: var(--ink-muted)">Big buttons, no text to follow. The screen dims after 10 seconds; tap anywhere to wake it.</p>
</div>

</body>
</html>
