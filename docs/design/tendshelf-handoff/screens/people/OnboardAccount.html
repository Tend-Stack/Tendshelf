<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First run 3 · Create your account</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Fira+Sans:wght@400;500;600&family=Fira+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
<style>body{margin:0}</style>
</head>
<body>
<!-- Static snapshot of the design board "OnboardAccount" (390 x 844). Reference markup, not production code. -->


<div style="width: 390px; height: 844px">


<div data-theme="dark" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font-family: var(--font-sans)">

  
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-linecap="round" aria-hidden="true"><rect x="7" y="8" width="11" height="32" rx="2.5" stroke-width="3"></rect><path d="M7 15h11M7 33h11" stroke-width="2.5"></path><path d="M18 24c2.6-9 4.6-9 7.2 0s4.6 9 7.2 0 3.4-5.5 5.3 0 2.6 3 4.3 0" stroke-width="3"></path></svg>
        <span style="font-family: var(--font-serif); font-size: 20px; font-weight: 600">Tendshelf</span>
      </div>
      <span class="caption ts-num" style="color: var(--ink-muted)">Step 3 of 3</span>
    </div>
    <div role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <span style="height: 4px; border-radius: 2px; background: var(--accent-fill)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--accent-fill)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--accent-fill)"></span>
    </div>
  

  

  

  
    <h1 class="title-1" style="margin: 40px 0 0">Create your account</h1>
    <p class="body-lg" style="margin: 10px 0 0; color: var(--ink-muted)">You're the owner. You decide who listens, and to what.</p>
    <div style="display: flex; flex-direction: column; gap: 18px; margin-top: 24px">
      <div class="ts-field" style="max-width: none"><label class="ts-field__label" for="nm">Your name</label><input id="nm" class="ts-input" type="text" value="Daniel Reyes" style=""></div>
      <div class="ts-field" style="max-width: none"><label class="ts-field__label" for="em">Email <span style="color: var(--ink-muted); font-weight: 400">(optional, for invites)</span></label><input id="em" class="ts-input" type="email" value="daniel@reyes.home" style=""></div>
    </div>
    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px">
      <button type="button" class="ts-btn ts-btn--primary ts-btn--lg ts-btn--block"><svg class="ts-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="10" r="4"></circle><path d="M11.5 12H21v3M17 12v3"></path></svg>Use a passkey</button>
      <button type="button" class="ts-btn ts-btn--secondary ts-btn--lg ts-btn--block">Use a password instead</button>
    </div>
    <p class="caption" style="margin: 16px 0 0; color: var(--ink-muted)">A passkey uses this phone's fingerprint or face unlock. Nothing to remember.</p>
    <div style="margin-top: auto; display: flex; align-items: flex-start; gap: 10px; padding: 14px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line)">
      <svg class="ts-icon" style="width: 20px; height: 20px; color: var(--success); margin-top: 1px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.4 3.4 8 8 9 4.6-1 8-4.6 8-9V6z"></path></svg>
      <p class="caption" style="margin: 0">Tendshelf sends nothing about you anywhere. No telemetry, no tracking, no ads.</p>
    </div>
  

  
</div>

</div>

</body>
</html>
