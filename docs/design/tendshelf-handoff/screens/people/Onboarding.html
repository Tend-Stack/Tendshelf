<body>
<!-- Static snapshot of the design board "Onboarding" (390 x 844). Reference markup, not production code. -->


<div data-theme="dark" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font-family: var(--font-sans)">

  
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-linecap="round" aria-hidden="true"><rect x="7" y="8" width="11" height="32" rx="2.5" stroke-width="3"></rect><path d="M7 15h11M7 33h11" stroke-width="2.5"></path><path d="M18 24c2.6-9 4.6-9 7.2 0s4.6 9 7.2 0 3.4-5.5 5.3 0 2.6 3 4.3 0" stroke-width="3"></path></svg>
        <span style="font-family: var(--font-serif); font-size: 20px; font-weight: 600">Tendshelf</span>
      </div>
      <span class="caption ts-num" style="color: var(--ink-muted)">Step 1 of 3</span>
    </div>
    <div role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <span style="height: 4px; border-radius: 2px; background: var(--accent-fill)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--line)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--line)"></span>
    </div>
  

  
    <div aria-hidden="true" style="margin-top: 56px; display: flex; flex-direction: column; align-items: center">
      <div style="display: flex; align-items: flex-end; gap: 5px; height: 120px">
        <span style="width: 26px; height: 88px; border-radius: 3px 3px 1px 1px; border: 1.5px dashed var(--line-strong); box-sizing: border-box"></span>
        <span style="width: 30px; height: 112px; border-radius: 3px 3px 1px 1px; border: 1.5px dashed var(--line-strong); box-sizing: border-box"></span>
        <span style="width: 24px; height: 96px; border-radius: 3px 3px 1px 1px; background: var(--accent-fill)"></span>
        <span style="width: 28px; height: 104px; border-radius: 3px 3px 1px 1px; border: 1.5px dashed var(--line-strong); box-sizing: border-box"></span>
        <span style="width: 26px; height: 80px; border-radius: 3px 3px 1px 1px; border: 1.5px dashed var(--line-strong); box-sizing: border-box"></span>
      </div>
      <div style="width: 200px; height: 7px; border-radius: 2px; background: var(--brand-walnut)"></div>
    </div>
    <h1 class="title-1" style="margin: 36px 0 0">Let's set up your shelf</h1>
    <p class="body-lg" style="margin: 10px 0 0; color: var(--ink-muted)">Tendshelf runs on this computer. Your books stay here, and the people you invite listen from their own phones.</p>
    <div class="ts-field" style="max-width: none; margin-top: 28px">
      <label class="ts-field__label" for="srv">Name your server</label>
      <input id="srv" class="ts-input is-focus" type="text" value="The Reyes family shelf" style="">
      <span class="ts-field__hint">People you invite will see this name. You can change it later.</span>
    </div>
    <button type="button" class="ts-btn ts-btn--primary ts-btn--lg ts-btn--block" style="margin-top: auto">Continue</button>
  

  

  

  
</div>
