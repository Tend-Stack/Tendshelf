<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar and role</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&amp;family=Fira+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="ts-preview" style="flex-direction: column; align-items: flex-start; gap: 20px">
  <div style="display: flex; gap: 16px; align-items: center">
    <span class="ts-avatar ts-avatar--lg" style="background: #5a4029" role="img" aria-label="Daniel Reyes">DR</span>
    <span class="ts-avatar ts-avatar--md" style="background: #1f4a52" role="img" aria-label="Rosa Reyes">RR</span>
    <span class="ts-avatar ts-avatar--md" style="background: #3b2f4a" role="img" aria-label="Maya Chen">MC</span>
    <span class="ts-avatar ts-avatar--sm" style="background: #2e3a2a" role="img" aria-label="Tomás Reyes">TR</span>
    <span class="ts-avatar ts-avatar--sm" style="background: #8c3b24" role="img" aria-label="Lena Reyes">LR</span>
  </div>
  <div style="display: flex; gap: 10px; align-items: center">
    <span class="ts-role ts-role--owner">Owner</span>
    <span class="ts-role">Admin</span>
    <span class="ts-role">Member</span>
    <span class="ts-role">Listener</span>
  </div>
</div>
</body>
</html>
