<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&amp;family=Fira+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="ts-preview" style="align-items: flex-start; gap: 40px">
  <div style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 16px; align-items: center">
      <span class="ts-ring-badge"><svg class="ts-ring" viewBox="0 0 28 28" role="img" aria-label="Not started"><circle class="ts-ring__track" cx="14" cy="14" r="11"></circle></svg></span>
      <span class="ts-ring-badge"><svg class="ts-ring" viewBox="0 0 28 28" role="img" aria-label="35% listened"><circle class="ts-ring__track" cx="14" cy="14" r="11"></circle><circle class="ts-ring__fill" cx="14" cy="14" r="11" stroke-dasharray="24.2 69.1"></circle></svg></span>
      <span class="ts-ring-badge"><svg class="ts-ring" viewBox="0 0 28 28" role="img" aria-label="80% listened"><circle class="ts-ring__track" cx="14" cy="14" r="11"></circle><circle class="ts-ring__fill" cx="14" cy="14" r="11" stroke-dasharray="55.3 69.1"></circle></svg></span>
      <span class="ts-ring-badge ts-ring-badge--done" role="img" aria-label="Finished"><svg class="ts-icon" style="width: 18px; height: 18px; stroke-width: 2.5" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>
    </div>
    <span class="ts-preview-label">Rings on covers · not started, 35%, 80%, finished</span>
    <div style="width: 300px; display: flex; flex-direction: column; gap: 8px">
      <div class="ts-bar" role="progressbar" aria-label="Downloading Salt and Ember" aria-valuemin="0" aria-valuemax="100" aria-valuenow="46"><div class="ts-bar__fill" style="width: 46%"></div></div>
      <span class="ts-preview-label ts-num">Downloading · 214 of 468 MB</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; width: 320px">
    <div class="ts-ruler" role="progressbar" aria-label="Book progress, chapter 12 of 19" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
      <div class="ts-ruler__line"></div>
      <div class="ts-ruler__fill" style="width: 62%"></div>
      <span class="ts-ruler__tick" style="left: 9.5%"></span><span class="ts-ruler__tick" style="left: 19.8%"></span><span class="ts-ruler__tick" style="left: 30.6%"></span><span class="ts-ruler__tick" style="left: 40.9%"></span><span class="ts-ruler__tick" style="left: 51.7%"></span><span class="ts-ruler__tick" style="left: 63.7%"></span><span class="ts-ruler__tick" style="left: 74.8%"></span><span class="ts-ruler__tick" style="left: 85.9%"></span><span class="ts-ruler__tick" style="left: 95.4%"></span>
    </div>
    <span class="ts-preview-label">The ruler: book progress with chapter ticks</span>
    <div aria-busy="true" aria-label="Loading" style="display: flex; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 8px"><div class="ts-skeleton" style="width: 96px; height: 96px; border-radius: var(--radius-cover)"></div><div class="ts-skeleton" style="width: 80px; height: 12px"></div><div class="ts-skeleton" style="width: 56px; height: 12px"></div></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><div class="ts-skeleton" style="width: 96px; height: 96px; border-radius: var(--radius-cover)"></div><div class="ts-skeleton" style="width: 88px; height: 12px"></div><div class="ts-skeleton" style="width: 64px; height: 12px"></div></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><div class="ts-skeleton" style="width: 96px; height: 96px; border-radius: var(--radius-cover)"></div><div class="ts-skeleton" style="width: 72px; height: 12px"></div><div class="ts-skeleton" style="width: 48px; height: 12px"></div></div>
    </div>
    <span class="ts-preview-label">Skeletons, never spinners, for loading regions</span>
  </div>
</div>
</body>
</html>
