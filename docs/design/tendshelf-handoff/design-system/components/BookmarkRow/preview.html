<!-- @dsCard group="Books" height=320 subtitle="A timeline of bookmarks with notes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmark row</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&amp;family=Fira+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="ts-preview" style="flex-direction: column; align-items: stretch; gap: 0; width: 440px">
  <article class="ts-mark">
    <div class="ts-mark__rail" aria-hidden="true"><span class="ts-mark__dot"></span><span class="ts-mark__stem"></span></div>
    <div class="ts-mark__body">
      <div class="ts-mark__when"><span>Chapter 12 · 14:06</span><span aria-hidden="true">·</span><span>Tonight</span><button type="button" class="ts-mark__jump" style="margin-left: auto">Play from here</button></div>
      <p class="ts-mark__quote">“She carried it up the hundred and nine steps with both hands…”</p>
      <p class="ts-mark__note">The second lamp is the father's. Check this against chapter 3.</p>
    </div>
    <button type="button" class="ts-iconbtn" aria-label="Edit note"><svg class="ts-icon" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
  </article>
  <article class="ts-mark">
    <div class="ts-mark__rail" aria-hidden="true"><span class="ts-mark__dot"></span><span class="ts-mark__stem"></span></div>
    <div class="ts-mark__body">
      <div class="ts-mark__when"><span>Chapter 9 · 2:41</span><span aria-hidden="true">·</span><span>Tuesday</span><button type="button" class="ts-mark__jump" style="margin-left: auto">Play from here</button></div>
      <p class="ts-mark__note">Lovely description of the harbour at dawn.</p>
    </div>
    <button type="button" class="ts-iconbtn" aria-label="Edit note"><svg class="ts-icon" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
  </article>
  <article class="ts-mark">
    <div class="ts-mark__rail" aria-hidden="true"><span class="ts-mark__dot" style="background: var(--line-strong)"></span></div>
    <div class="ts-mark__body">
      <div class="ts-mark__when"><span>Chapter 4 · 31:10</span><span aria-hidden="true">·</span><span>12 Oct</span><button type="button" class="ts-mark__jump" style="margin-left: auto">Play from here</button></div>
      <p class="ts-mark__note" style="color: var(--ink-muted)">No note</p>
    </div>
    <button type="button" class="ts-iconbtn" aria-label="Add a note"><svg class="ts-icon" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </article>
</div>
</body>
</html>
