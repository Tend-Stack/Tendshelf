<!-- @dsCard group="Selection" height=150 subtitle="Underline tabs for sections and modes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&amp;family=Fira+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="ts-preview" style="flex-direction: column; align-items: stretch; gap: 24px; max-width: 560px">
  <div role="tablist" aria-label="Book" class="ts-tabs">
    <button type="button" role="tab" aria-selected="true" class="ts-tabs__item">About</button>
    <button type="button" role="tab" aria-selected="false" class="ts-tabs__item">Chapters</button>
    <button type="button" role="tab" aria-selected="false" class="ts-tabs__item is-hover">Bookmarks</button>
    <button type="button" role="tab" aria-selected="false" class="ts-tabs__item is-focus">Details</button>
  </div>
  <div role="group" aria-label="Mode" style="display: flex; gap: 4px">
    <button type="button" aria-pressed="false" class="ts-tabs__item">Listen</button>
    <button type="button" aria-pressed="true" class="ts-tabs__item" style="color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent)">Read along</button>
    <button type="button" aria-pressed="false" class="ts-tabs__item">Read</button>
  </div>
</div>
</body>
</html>
