<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Format markers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&amp;family=Fira+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="ts-preview" style="gap: 32px">
  <div class="ts-chip-set">
    <span class="ts-fmt"><svg class="ts-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3.5" y="14" width="4" height="6.5" rx="1.5"></rect><rect x="16.5" y="14" width="4" height="6.5" rx="1.5"></rect></svg>Audiobook</span>
    <span class="ts-fmt"><svg class="ts-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"></path><path d="M12 6v13"></path></svg>Ebook</span>
    <span class="ts-fmt ts-fmt--both"><svg class="ts-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6C5.6 5.2 8 5.2 10 6.4v12c-2-1.2-4.4-1.2-6.5-.4z"></path><path d="M14 9.5a3 3 0 0 1 0 5M16.5 7a6.5 6.5 0 0 1 0 10M19 4.5a10 10 0 0 1 0 15"></path></svg>Read along</span>
    <span class="ts-fmt ts-fmt--missing"><svg class="ts-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"></path><path d="M12 6v13"></path></svg>No ebook</span>
  </div>
  <div style="position: relative; width: 120px; height: 120px">
    <span class="ts-cover" style="width: 120px; height: 120px; display: block; background: linear-gradient(160deg, #1f4a52, #0f2a30)"></span>
    <span class="ts-fmt-badge" role="img" aria-label="Has read-along"><svg class="ts-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6C5.6 5.2 8 5.2 10 6.4v12c-2-1.2-4.4-1.2-6.5-.4z"></path><path d="M14 9.5a3 3 0 0 1 0 5M16.5 7a6.5 6.5 0 0 1 0 10M19 4.5a10 10 0 0 1 0 15"></path></svg></span>
  </div>
</div>
</body>
</html>
