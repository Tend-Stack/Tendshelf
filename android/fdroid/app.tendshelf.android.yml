# F-Droid build recipe (plan A10), ready to submit as metadata/app.tendshelf.android.yml in fdroiddata (operator chose
# F-Droid, 2026-11-07; docs/android.md says how). v2026.4.0 is the first release with the Android app. For a later
# release, set versionName, versionCode, commit, gradleprops and CurrentVersion to its tag
# (versionCode = year * 100000 + release * 1000 + fix).
Categories:
  - Multimedia
License: AGPL-3.0-only
SourceCode: https://github.com/Tend-Stack/Tendshelf
IssueTracker: https://github.com/Tend-Stack/Tendshelf/issues

AutoName: Tendshelf

RepoType: git
Repo: https://github.com/Tend-Stack/Tendshelf.git
# The signed APK attached to each GitHub release. F-Droid rebuilds from source, and publishes this APK only when its
# build matches it byte for byte apart from the signature (android/tools/repro-check.sh checks the same here).
Binaries: https://github.com/Tend-Stack/Tendshelf/releases/download/v%v/tendshelf-%v.apk

Builds:
  - versionName: 2026.4.0
    versionCode: 202604000
    commit: v2026.4.0
    # The Gradle project is android/; the app copies the server's CSS and fonts from ../internal/web/static,
    # so the whole repository is needed, not only android/app.
    subdir: android/app
    gradle:
      - yes
    gradleprops:
      - tsVersion=2026.4.0

  - versionName: 2026.5.0
    versionCode: 202605000
    commit: v2026.5.0
    subdir: android/app
    gradle:
      - yes
    gradleprops:
      - tsVersion=2026.5.0

  - versionName: 2026.6.0
    versionCode: 202606000
    commit: v2026.6.0
    subdir: android/app
    gradle:
      - yes
    gradleprops:
      - tsVersion=2026.6.0

  - versionName: 2026.7.0
    versionCode: 202607000
    commit: v2026.7.0
    subdir: android/app
    gradle:
      - yes
    gradleprops:
      - tsVersion=2026.7.0

  - versionName: 2026.8.0
    versionCode: 202608000
    commit: v2026.8.0
    subdir: android/app
    gradle:
      - yes
    gradleprops:
      - tsVersion=2026.8.0

  - versionName: 2026.8.1
    versionCode: 202608001
    commit: v2026.8.1
    subdir: android/app
    gradle:
      - yes
    gradleprops:
      - tsVersion=2026.8.1

  - versionName: 2026.9.0
    versionCode: 202609000
    commit: v2026.9.0
    subdir: android/app
    gradle:
      - yes
    gradleprops:
      - tsVersion=2026.9.0

# The SHA-256 of the operator's release certificate (docs/android.md). F-Droid accepts only APKs signed by it, which is
# what lets a reproducible build be published with the developer's own signature.
AllowedAPKSigningKeys: 221e61dc9644e5feb1a17b42e31d86c508a47c986aa0df6451cae203c6e0b6f2

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 2026.9.0
CurrentVersionCode: 202609000
