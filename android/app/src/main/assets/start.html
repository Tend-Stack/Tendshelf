<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tendshelf</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/bundle.css">
<link rel="stylesheet" href="/assets/start.css">
</head>
<body>
<main class="start">
<h1>{{TITLE}}</h1>
<p>{{BODY}}</p>
{{NOTE}}
<form method="get" action="/connect">
<label for="address">{{LABEL}}</label>
<input id="address" name="address" value="{{ADDRESS}}" placeholder="{{HINT}}" inputmode="url" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false">
<button type="submit" class="ts-btn ts-btn--primary ts-btn--lg ts-btn--block">{{BUTTON}}</button>
</form>
</main>
</body>
</html>
